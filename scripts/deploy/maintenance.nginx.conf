# Include inside the Sayseed HTTPS server block. Match state_dir in config.json.
# The nginx worker needs traverse access to state_dir; JSON state files stay 0600.
error_page 503 @sayseed_maintenance;
if (-f /var/lib/sayseed-update/maintenance) {
    return 503;
}
location @sayseed_maintenance {
    add_header X-Sayseed-Maintenance 1 always;
    add_header Retry-After 120 always;
    default_type text/html;
    charset utf-8;
    return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Sayseed 更新中</title><h1>正在更新 Sayseed</h1><p>请稍后刷新，已有数据会保留。</p></html>';
}
