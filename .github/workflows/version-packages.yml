name: Version Packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-packages-main
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.repository == 'Castor6/sayseed' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CHANGESETS_TOKEN: ${{ secrets.CHANGESETS_TOKEN != '' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Only process the current main commit
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const expected = context.payload.workflow_run?.head_sha ?? context.sha;
            core.setOutput('run', data.commit.sha === expected);
            core.setOutput('sha', data.commit.sha);
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.source.outputs.run == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        if: steps.source.outputs.run == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.source.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.source.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.source.outputs.run == 'true'
        run: pnpm check:release
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        if: steps.source.outputs.run == 'true'
        id: changesets
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN || github.token }}
          branch: main
          commitMode: github-api
          version: pnpm version-packages
          title: Version Packages
          commit: "chore: version packages"
          createGithubReleases: false
      - name: Run version PR checks when using the repository token
        if: steps.changesets.outputs.pullRequestNumber != '' && env.HAS_CHANGESETS_TOKEN != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.VERSION_PR)});
            if (pr.state !== 'open' || pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.ref !== 'changeset-release/main' || pr.base.ref !== 'main') {
              throw new Error('Unexpected version PR source');
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci.yml', ref: pr.head.ref,
            });
