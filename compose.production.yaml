name: sayseed

services:
  sayseed:
    image: ${SAYSEED_IMAGE:?Set SAYSEED_IMAGE to a released image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAYSEED_PORT:-3000}:3000"
    environment:
      SAYSEED_PASSWORD: ${SAYSEED_PASSWORD:?Set SAYSEED_PASSWORD in .env}
      SAYSEED_PUBLIC_URL: ${SAYSEED_PUBLIC_URL:?Set the external HTTPS origin}
    volumes:
      - sayseed-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sayseed-data:
    name: ${SAYSEED_VOLUME:-sayseed-data}
